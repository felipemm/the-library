default_dirs:
  skills:
    - default: .pi/agent/skills/
    - global: ~/.pi/agent/skills/
  agents:
    - default: .pi/agent/agents/
    - global: ~/.pi/agent/agents/
  prompts:
    - default: .pi/agent/prompts/
    - global: ~/.pi/agent/prompts/
  extensions:
    - default: .pi/agent/extensions/
    - global: ~/.pi/agent/extensions/
  themes:
    - default: .pi/agent/themes/
    - global: ~/.pi/agent/themes/

library:
  skills:
    - name: test-coverage
      description: Adds, validates, and improves automated tests for a codebase or a single change
      source: https://github.com/felipemm/fmm-ai-library/blob/main/skills/engineering/test-coverage/SKILL.md
  agents: []
  prompts: []
  extensions:
    - name: minimal
      description: Model name + context meter in a compact footer for Pi
      source: https://github.com/felipemm/the-library/blob/main/files/extensions/minimal.ts
  themes: []
